name: Simple CI-CD
 
on:
push:
branches: [ "main" ]
 
jobs:
build-and-test:
runs-on: ubuntu-latest
 
steps:
- name: Checkout Code
uses: actions/checkout@v4
 
- name: Build Docker Image
run: docker build -t cicd-demo .
 
- name: Run Container
run: docker run -d -p 3000:3000 cicd-demo
 
- name: Test Application
run: curl -I http://localhost:3000
